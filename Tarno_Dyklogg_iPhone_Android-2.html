header,main,.footerbar{position:relative}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 20px;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px #0003}
.brand{display:flex;align-items:center;gap:16px;max-width:760px;margin:auto}
.brand img{height:64px;width:auto;max-width:58%;object-fit:contain;display:block;filter:drop-shadow(0 1px 1px #0002)}
.brand h1{font-size:20px;margin:0;line-height:1.05}
.brand small{opacity:.8}
main{max-width:760px;margin:auto;padding:14px max(12px,env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.card{background:rgba(255,255,255,.94);border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:0 3px 16px #10203012}
h2{font-size:16px;margin:0 0 12px;color:var(--navy)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid1{display:grid;grid-template-columns:1fr;gap:10px}
label{font-size:12px;font-weight:700;color:var(--muted)}
input,textarea,select{width:100%;font:inherit;padding:11px;border:1px solid #ccd4da;border-radius:10px;margin-top:5px;background:#fff}
textarea{min-height:75px;resize:vertical}
.time-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.timebtn{min-height:82px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;border:0;border-radius:14px;background:var(--navy);color:#fff;font-weight:800;font-size:15px;padding:10px;box-shadow:0 4px 10px #0002}
.timebtn.done{background:var(--ok)}
.timebtn span{display:block;font-size:22px;margin-top:5px;font-variant-numeric:tabular-nums}
.live-timer{margin:0 0 12px;padding:14px;border:2px solid var(--brass);border-radius:14px;background:var(--navy);color:#fff;text-align:center;box-shadow:0 4px 12px #0002}
.live-timer small{display:block;font-weight:800;letter-spacing:1.2px;color:#f0cf8d}
.live-timer b{display:block;margin-top:3px;font-size:42px;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:1px}
.live-timer.running b{color:#7ff0b4}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stat{padding:10px;background:#f4f7f9;border-radius:10px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;color:var(--navy)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.secondary,button.primary,button.danger{border:0;border-radius:12px;padding:13px;font-weight:800;font-size:15px}
button.primary{background:var(--brass);color:#101820}
button.secondary{background:#dce4e9;color:var(--navy)}
button.danger{background:#f3dfdc;color:var(--danger)}
.diveitem{border-top:1px solid #e2e7ea;padding:10px 0}
.diveitem:first-child{border-top:0}
.diveitem strong{color:var(--navy)}
.mono{font-variant-numeric:tabular-nums}
.badge{display:inline-block;background:#e8eef3;color:var(--navy);padding:3px 7px;border-radius:999px;font-size:11px;font-weight:700}
.footerbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #d9e0e5;padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:6}
.footerbar>div{max-width:760px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.grid{grid-template-columns:1fr} .brand img{height:54px;max-width:62%} .brand h1{font-size:18px}}
@media print{
 header,.footerbar,.no-print{display:none!important} body{background:#fff} body::before{opacity:.045;background-size:70% auto} main{padding:0;max-width:none} .card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
}
</style>

   <div><h1>TÄRNÖ DYKERI<br>DYKLOGG</h1><small>Dykledarjournal</small></div>
 </div>
</header>
<main>
  <section class="card">
    <h2>Arbetsdag</h2>
    <div class="grid">
      <label>Datum<input id="date" type="date"></label>
      <label>Projekt / arbetsorder<input id="project" placeholder="T.ex. PEAB-2026-041"></label>
      <label>Kund<input id="customer" placeholder="Beställare"></label>
      <label>Arbetslokation<input id="location" placeholder="Plats / objekt"></label>
    </div>
  </section>

  <section class="card">
    <h2>Besättning</h2>
    <div class="grid">
      <label>Dykare<input id="diver" list="people" placeholder="Namn"></label>
      <label>Reservdykare<input id="standby" list="people" placeholder="Namn"></label>
      <label>Dykledare<input id="supervisor" list="people" placeholder="Namn"></label>
      <label>Dykskötare<input id="tender" list="people" placeholder="Namn"></label>
    </div>
    <datalist id="people"></datalist>
  </section>

  <section class="card">
    <h2>Aktuellt dyk <span id="diveNo" class="badge">Dyk 1</span></h2>
    <div class="grid">
      <label>Planerat djup (m)<input id="plannedDepth" inputmode="decimal" placeholder="0,0"></label>
      <label>Maxdjup (m)<input id="maxDepth" inputmode="decimal" placeholder="0,0"></label>
    </div>
    <div style="height:10px"></div>
    <div class="live-timer" id="liveTimerBox" aria-live="polite">
      <small>DYKTID LIVE</small>
      <b id="liveDiveTime">00:00:00</b>
    </div>
    <div class="time-grid">
      <button class="timebtn" data-key="splash">STARTA DYK / HOPPAR I<span>--:--:--</span></button>
      <button class="timebtn" data-key="bottom">PÅ BOTTEN<span>--:--:--</span></button>
      <button class="timebtn" data-key="ascent">START UPPSTIGNING<span>--:--:--</span></button>
      <button class="timebtn" data-key="surface">PÅ YTAN<span>--:--:--</span></button>
    </div>
    <div class="stats">
      <div class="stat"><small>Bottentid</small><b id="bottomTime">00:00:00</b></div>
      <div class="stat"><small>Total dyktid</small><b id="totalTime">00:00:00</b></div>
    </div>
    <div style="height:10px"></div>
    <label>Arbete / anmärkningar<textarea id="notes" placeholder="Utfört arbete, observationer, avvikelser…"></textarea></label>
    <div style="height:10px"></div>
    <div class="actions">
      <button class="secondary no-print" id="resetDive">Rensa dyk</button>
      <button class="primary no-print" id="saveDive">SPARA DYK</button>
    </div>
  </section>

  <section class="card">
    <h2>Dagens dyk</h2>
    <div id="history"><span style="color:#77838d">Inga sparade dyk ännu.</span></div>
  </section>

  <section class="card">
    <h2>Daganteckning</h2>
    <textarea id="dayNotes" placeholder="Övergripande anteckningar för arbetsdagen…"></textarea>
  </section>
</main>

<div class="footerbar no-print"><div>
  <button class="secondary" id="exportBtn">SKRIV UT / PDF</button>
  <button class="danger" id="newDayBtn">NY ARBETSDAG</button>
</div></div>

<script>
const $=id=>document.getElementById(id);
const stateKey='tarno-dyklogg-v1';
let state={day:{},current:{times:{}},dives:[],people:[]};
let memoryStore=null;
function storageSet(value){
  const json=JSON.stringify(value);
  try{localStorage.setItem(stateKey,json);return true}catch(e){}
  try{sessionStorage.setItem(stateKey,json);return true}catch(e){}
  memoryStore=json; return false;
}
function storageGet(){
  try{const v=localStorage.getItem(stateKey);if(v)return v}catch(e){}
  try{const v=sessionStorage.getItem(stateKey);if(v)return v}catch(e){}
  return memoryStore;
}

function nowTime(){const d=new Date();return [d.getHours(),d.getMinutes(),d.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':')}
function sec(t){if(!t)return null; let p=t.split(':').map(Number);return p[0]*3600+p[1]*60+p[2]}
function diff(a,b){if(!a||!b)return 0;let d=sec(b)-sec(a);if(d<0)d+=86400;return d}
function fmt(s){s=Math.max(0,s||0);let h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;return [h,m,x].map(v=>String(v).padStart(2,'0')).join(':')}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function persist(){
  state.day={
    date:$('date').value,project:$('project').value,customer:$('customer').value,location:$('location').value,
    supervisor:$('supervisor').value,standby:$('standby').value,tender:$('tender').value,dayNotes:$('dayNotes').value
  };
  storageSet(state)
}
function load(){
  try{let saved=storageGet();let s=saved?JSON.parse(saved):null;if(s)state=s}catch(e){}
  state.day=state.day||{};
  state.current=state.current||{};
  state.current.times=state.current.times||{};
  state.dives=Array.isArray(state.dives)?state.dives:[];
  state.people=Array.isArray(state.people)?state.people:[];
  $('date').value=state.day?.date||new Date().toISOString().slice(0,10);
  ['project','customer','location','supervisor','standby','tender','dayNotes'].forEach(k=>{if($(k))$(k).value=state.day?.[k]||''});
  renderPeople(); renderTimes(); renderHistory();
}
function renderPeople(){
  $('people').innerHTML=(state.people||[]).map(n=>`<option value="${esc(n)}">`).join('');
}
function renderTimes(){
  document.querySelectorAll('.timebtn').forEach(b=>{
    let k=b.dataset.key,t=state.current?.times?.[k];
    b.querySelector('span').textContent=t||'--:--:--'; b.classList.toggle('done',!!t);
  });
  liveTick();
  $('diveNo').textContent='Dyk '+((state.dives?.length||0)+1);
}

function liveTick(){
  const t=state.current?.times||{};
  const now=nowTime();
  // Stor synlig dyktidsklocka: startar vid STARTA DYK/HOPPAR I och stannar vid PÅ YTAN.
  const liveSeconds=t.splash?diff(t.splash,t.surface||now):0;
  $('liveDiveTime').textContent=fmt(liveSeconds);
  $('liveTimerBox').classList.toggle('running',!!t.splash&&!t.surface);
  // Bottentid rullar från PÅ BOTTEN tills START UPPSTIGNING registreras.
  if(t.bottom){
    $('bottomTime').textContent=fmt(diff(t.bottom,t.ascent||now));
  }else{
    $('bottomTime').textContent='00:00:00';
  }
  // Total dyktid rullar från HOPPAR I tills PÅ YTAN registreras.
  if(t.splash){
    $('totalTime').textContent=fmt(diff(t.splash,t.surface||now));
  }else{
    $('totalTime').textContent='00:00:00';
  }
}

function renderHistory(){
  if(!state.dives?.length){$('history').innerHTML='<span style="color:#77838d">Inga sparade dyk ännu.</span>';return}
  $('history').innerHTML=state.dives.map((d,i)=>`
    <div class="diveitem">
      <strong>Dyk ${i+1} – ${esc(d.diver)}</strong> <span class="badge">${esc(d.maxDepth||d.plannedDepth||'-')} m</span><br>
      <span class="mono">${d.times.splash||'--'} → ${d.times.bottom||'--'} → ${d.times.ascent||'--'} → ${d.times.surface||'--'}</span><br>
      Bottentid <b>${fmt(diff(d.times.bottom,d.times.ascent))}</b> · Total <b>${fmt(diff(d.times.splash,d.times.surface))}</b>
      ${d.notes?`<div style="margin-top:5px;color:#5b6770">${esc(d.notes)}</div>`:''}
      <button class="danger no-print" style="margin-top:7px;padding:7px 10px" onclick="delDive(${i})">Ta bort</button>
    </div>`).join('');
}
window.delDive=i=>{if(confirm('Ta bort detta dyk?')){state.dives.splice(i,1);persist();renderHistory();renderTimes()}}
const timeOrder=['splash','bottom','ascent','surface'];
const timeLabels={splash:'HOPPAR I',bottom:'PÅ BOTTEN',ascent:'START UPPSTIGNING',surface:'PÅ YTAN'};
function validTime(v){
  if(!/^\d{2}:\d{2}:\d{2}$/.test(v||''))return false;
  const [h,m,s]=v.split(':').map(Number);
  return h>=0&&h<24&&m>=0&&m<60&&s>=0&&s<60;
}
document.querySelectorAll('.timebtn').forEach(b=>{
  b.type='button';
  b.addEventListener('click',()=>{
    state.current=state.current||{times:{}};
    state.current.times=state.current.times||{};
    const k=b.dataset.key;
    const idx=timeOrder.indexOf(k);
    if(state.current.times[k]){
      const v=prompt('Ändra tid för '+timeLabels[k]+' (HH:MM:SS)',state.current.times[k]);
      if(v===null)return;
      if(!validTime(v))return alert('Skriv tiden som HH:MM:SS, till exempel 07:42:15.');
      state.current.times[k]=v;
    }else{
      if(idx>0 && !state.current.times[timeOrder[idx-1]]){
        return alert('Registrera '+timeLabels[timeOrder[idx-1]]+' först.');
      }
      state.current.times[k]=nowTime();
    }
    renderTimes();
    persist();
  });
});
$('saveDive').onclick=()=>{
  if(!$('diver').value.trim())return alert('Fyll i dykarens namn.');
  if(!state.current.times.splash)return alert('Registrera minst tiden HOPPAR I.');
  let d={
    diver:$('diver').value.trim(), standby:$('standby').value.trim(), supervisor:$('supervisor').value.trim(), tender:$('tender').value.trim(),
    plannedDepth:$('plannedDepth').value, maxDepth:$('maxDepth').value, notes:$('notes').value.trim(),
    times:{...state.current.times}
  };
  state.dives.push(d);
  [d.diver,d.standby,d.supervisor,d.tender].filter(Boolean).forEach(n=>{if(!state.people.includes(n))state.people.push(n)});
  state.current={times:{}};
  $('plannedDepth').value='';$('maxDepth').value='';$('notes').value='';
  persist();renderPeople();renderTimes();renderHistory();
};
$('resetDive').onclick=()=>{if(confirm('Rensa aktuella tider och anteckningar?')){state.current={times:{}};$('plannedDepth').value='';$('maxDepth').value='';$('notes').value='';persist();renderTimes()}};
$('exportBtn').onclick=()=>{persist();window.print()};
$('newDayBtn').onclick=()=>{
  if(!confirm('Starta ny arbetsdag? Dagens sparade dyk rensas från appens aktiva vy. Skriv gärna ut/PDF först.'))return;
  let ppl=state.people||[], sup=$('supervisor').value, standby=$('standby').value,tender=$('tender').value;
  state={day:{date:new Date().toISOString().slice(0,10),supervisor:sup,standby:standby,tender:tender},current:{times:{}},dives:[],people:ppl};
  storageSet(state);location.reload();
};
['date','project','customer','location','supervisor','standby','tender','dayNotes'].forEach(k=>$(k).addEventListener('input',persist));
load();
// iPhone/iPad: håll live-räknarna korrekta efter låsskärm/appväxling.
window.addEventListener('pageshow',()=>{renderTimes();liveTick()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){renderTimes();liveTick()}});
document.addEventListener('touchstart',()=>{}, {passive:true});

setInterval(liveTick,1000);
// Självbärande delningsfil: ingen service worker behövs.
</script>
</body></html>
